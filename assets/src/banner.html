<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2000px; height: 800px; }
  body {
    background: #f7f7f6; color: #182834; font-family: "Geist", system-ui, sans-serif;
    display: grid; grid-template-columns: 860px 1fr; overflow: hidden;
    background-image: linear-gradient(#e3e6e5 1px, transparent 1px);
    background-size: 100% 80px; background-position: 0 40px;
  }
  .left { padding: 96px 0 0 110px; position: relative; z-index: 1; }
  .mark { display: flex; align-items: center; gap: 22px; font-size: 40px; font-weight: 600; letter-spacing: .13em; }
  .ring { width: 70px; height: 70px; border: 4px solid #182834; border-radius: 50%; display: grid; place-items: center; font-size: 40px; letter-spacing: 0; }
  h1 { margin-top: 74px; font-size: 92px; line-height: 1.02; font-weight: 600; letter-spacing: -.035em; }
  h1 span { color: #0b4b37; }
  p { margin-top: 34px; width: 700px; font-size: 30px; line-height: 1.4; color: #455059; }
  .chips { display: flex; gap: 14px; margin-top: 40px; }
  .chip { padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 500; border: 2px solid #0b4b37; color: #0b4b37; }
  .chip.solid { background: #0b4b37; color: #f7f7f7; }
  .right { position: relative; }
  .card {
    position: absolute; left: 30px; top: 92px; width: 1180px; border-radius: 18px; overflow: hidden;
    transform: rotate(-2.2deg); border: 2px solid #c6c9ca;
    box-shadow: 14px 16px 0 #0b4b37, 0 30px 60px rgba(24,40,52,.18);
  }
  .card img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="left">
    <div class="mark"><span class="ring">R</span>RINGSIDE</div>
    <h1>Answers the call.<br><span>Holds the money.</span></h1>
    <p>The AI front desk for one-person trades: it quotes from the rate card, holds the payment with PayPal, and captures it when the job is done.</p>
    <div class="chips"><span class="chip solid">PayPal AI Hackathon</span><span class="chip">PayPal sandbox</span></div>
  </div>
  <div class="right"><div class="card"><img src="../screens/landing.jpg" alt=""></div></div>
</body>
</html>
