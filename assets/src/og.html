<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f2f5f9; color: #0f1b2d; font-family: "Figtree", system-ui, sans-serif; position: relative; }
  .text { position: absolute; left: 64px; top: 58px; width: 640px; }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: .06em; }
  .mark svg { width: 54px; height: 54px; }
  h1 { margin-top: 48px; font-size: 64px; line-height: 1.04; font-weight: 800; letter-spacing: -.03em; }
  h1 span { display: block; color: #1557c0; }
  .what { margin-top: 26px; width: 560px; font-size: 27px; line-height: 1.32; font-weight: 600; color: #465264; }
  .what b { color: #0f1b2d; font-weight: 800; }
  .demo { position: absolute; left: 64px; bottom: 54px; display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-radius: 999px; background: #fff; border: 1.5px solid #e2e7ee; font-size: 19px; font-weight: 600; color: #465264; }
  .demo .dot { width: 5px; height: 5px; border-radius: 50%; background: #9aa5b4; }
  .demo .pp { color: #142c8e; font-weight: 800; }
  .art { position: absolute; top: 0; right: 0; width: 470px; height: 630px; background: linear-gradient(160deg, #0b3a8a, #1557c0); overflow: hidden; }
  .phone { position: absolute; width: 232px; border-radius: 26px; overflow: hidden; border: 8px solid #0d1726; box-shadow: 0 24px 48px rgba(4, 20, 50, .45); background: #fff; }
  .phone img { display: block; width: 100%; }
  .p1 { left: 22px; top: 70px; transform: rotate(-4deg); }
  .p2 { left: 226px; top: 112px; transform: rotate(3.5deg); }
  .tag { position: absolute; padding: 9px 15px; border-radius: 12px; background: #fff; color: #0f1b2d; font-size: 18px; font-weight: 800; box-shadow: 0 10px 24px rgba(4, 20, 50, .3); white-space: nowrap; }
  .t1 { left: 26px; top: 548px; }
  .t2 { left: 200px; top: 46px; }
</style>
</head>
<body>
  <div class="text">
    <div class="mark">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="24" fill="#1557c0" />

    <div class="phone p1"><img src="../screens/app-job.jpg" alt=""></div>
