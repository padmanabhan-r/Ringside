# Render Blueprint: the Ringside web service and its Postgres database.
# Secrets are added with sync: false as features need them (prompted in the dashboard, never in git).
services:
  - type: web
    runtime: node
    name: ringside
    region: oregon
    plan: 0.5c-512mb # $7/mo, always on: judges must never hit a cold start
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PAYPAL_ENV
        value: sandbox # the server refuses to start on anything else
      - key: DATABASE_URL
        fromDatabase:
          name: ringside-db
          property: connectionString # private-network URL
      - key: APP_BASE_URL
        value: https://ringside-4bup.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ELEVENLABS_TOOL_SECRET
        sync: false # the shared secret the agent's server tools send in x-ringside-tool-secret
      - key: EMAIL_FROM
        value: "Mike's Plumbing <bookings@ringside.padmanabhan.xyz>"
      - key: RESEND_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # printed by scripts/paypal/create-webhook.mjs; verify-webhook-signature needs it
      - key: RENDER_WORKFLOW
        value: ringside-close-out # the workflow's slug (its name); the close-out runs inline until the key below is set
      - key: RENDER_WORKFLOW_API_KEY
        sync: false # a Render API key just for starting close-out runs (POST /v1/task-runs)
      - key: VAPID_PUBLIC_KEY
        sync: false # web push for Mike's dashboard; all three from node scripts/push/vapid.mjs (local .env)
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # a contact for push services, e.g. mailto:you@example.com

  # The close-out after Mike's confirmed "job done": receipt invoice, then completed → closed. Retried by Render;
  # every step is idempotent. Runs the app's TypeScript as written (Node 24 type stripping, workflows/register.mjs).
  - type: workflow
    runtime: node
    name: ringside-close-out
    region: oregon
    buildCommand: npm ci
    startCommand: node --experimental-transform-types --import ./workflows/register.mjs workflows/close-out.ts
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: ringside-db
          property: connectionString
      - key: APP_BASE_URL
        value: https://ringside-4bup.onrender.com
      - key: PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: ringside
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          type: web
          name: ringside
          envVarKey: PAYPAL_CLIENT_SECRET
      # The close-out also emails the customer's receipt (PayPal's own invoice only reaches the sandbox payer).
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: ringside
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: ringside
          envVarKey: EMAIL_FROM

databases:
  - name: ringside-db
    region: oregon
    plan: 0.1c-256mb # $6/mo; free Postgres would be deleted mid-judging
    diskSizeGB: 1 # $0.30/mo; the default would be 15 GB
    postgresMajorVersion: "18"
    databaseName: ringside
    user: ringside
    ipAllowList: [] # private network only
