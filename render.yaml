# Render Blueprint: the Ringside web service and its Postgres database.
# Secrets are added with sync: false as features need them (prompted in the dashboard, never in git).
services:
  - type: web
    runtime: node
    name: ringside
    region: oregon
    plan: 0.5c-512mb # $7/mo, always on: judges must never hit a cold start
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PAYPAL_ENV
        value: sandbox # the server refuses to start on anything else
      - key: DATABASE_URL
        fromDatabase:
          name: ringside-db
          property: connectionString # private-network URL
      - key: CHANGE_ORDER_MODE
        value: second_order # PayPal captures at most 115% of a hold, so a bigger change is its own payment
      - key: APP_BASE_URL
        value: https://ringside-4bup.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ELEVENLABS_TOOL_SECRET
        sync: false # the shared secret the agent's server tools send in x-ringside-tool-secret

databases:
  - name: ringside-db
    region: oregon
    plan: 0.1c-256mb # $6/mo; free Postgres would be deleted mid-judging
    diskSizeGB: 1 # $0.30/mo; the default would be 15 GB
    postgresMajorVersion: "18"
    databaseName: ringside
    user: ringside
    ipAllowList: [] # private network only
